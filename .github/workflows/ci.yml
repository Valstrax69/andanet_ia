name: ci-ia
 
# Pipeline del micro de IA: entrena (gate de metrica), prueba y publica la imagen.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
    tags: ["ep2"]
 
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ia
 
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
 
      - name: Tratamiento y entrenamiento (gate de metrica)
        run: python datos/preparar.py
 
      - name: Test del microservicio (/predict valido)
        env:
          PYTHONPATH: .
        run: pytest -q
 
      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=ref,event=tag
 
      - name: Login a GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Build y push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
 